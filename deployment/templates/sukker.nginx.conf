# Sukker.nu ({{env}}). Styres af deploy.py – ændringer her overskrives ved næste udgivelse.

# Adgangslog uden IP-adresser, forespørgselsparametre og browseroplysninger (specifikation 13.2).
# Bruges af overvågningen til fejlraten.
log_format {{id}}_json escape=json '{"t":"$time_iso8601","m":"$request_method","p":"$uri","s":$status,"rt":$request_time,"b":$body_bytes_sent}';

# Statiske filer med ?v=<hash> ændrer aldrig indhold og kan caches i et år.
map $arg_v ${{id}}_static_cache {
    ""      "public, max-age=86400";
    default "public, max-age=31536000, immutable";
}

upstream {{id}}_app {
    server unix:/run/{{service}}/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name {{server_names}};

    location ^~ /.well-known/acme-challenge/ {
        root {{acme_root}};
        default_type text/plain;
    }
    location / {
        return 301 https://{{domain}}$request_uri;
    }
}
{{alias_block}}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name {{domain}};

    ssl_certificate {{cert_dir}}/fullchain.pem;
    ssl_certificate_key {{cert_dir}}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:{{id}}_tls:10m;
    ssl_session_timeout 1d;

    client_max_body_size 16m;
    access_log {{log_dir}}/access.log {{id}}_json;
    error_log {{log_dir}}/nginx-error.log warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;
{{basic_auth}}
    location /static/ {
        alias {{app_root}}/current/app/static/;
        add_header Cache-Control ${{id}}_static_cache;
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    # Billeder leveres kun via X-Accel-Redirect efter adgangskontrol i applikationen (specifikation 4.3).
    location ^~ /_protected_media/ {
        internal;
        alias {{data_root}}/;
    }

    location ~ ^/health(/ready)?$ {
        auth_basic off;
        proxy_pass http://{{id}}_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://{{id}}_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    # Vedligeholdelsesside, når applikationen ikke svarer (specifikation 14.8).
    error_page 502 503 504 /_vedligeholdelse.html;
    location = /_vedligeholdelse.html {
        root {{app_root}}/shared/maintenance;
        internal;
        auth_basic off;
    }
}
