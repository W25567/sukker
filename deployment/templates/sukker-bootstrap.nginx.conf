# Sukker.nu ({{env}}): midlertidig HTTP-konfiguration, mens certifikatet hentes første gang. Styres af deploy.py.
server {
    listen 80;
    listen [::]:80;
    server_name {{server_names}};

    location ^~ /.well-known/acme-challenge/ {
        root {{acme_root}};
        default_type text/plain;
    }
    location / {
        return 503;
    }
}
