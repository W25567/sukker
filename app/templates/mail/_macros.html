{# Knap og reservelink til HTML-mails (inline styles, da mailprogrammer ikke læser stylesheets). #}
{% macro button(url, label) %}
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0;">
    <tr><td style="border-radius:999px;background:{{ brand.theme_color }};">
      <a href="{{ url }}" style="display:inline-block;padding:14px 28px;border-radius:999px;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:bold;color:#ffffff;text-decoration:none;">{{ label }}</a>
    </td></tr>
  </table>
{% endmacro %}
{% macro fallback(url) %}
  <p style="margin:0 0 16px;font-size:13px;color:#6f6475;">Virker knappen ikke, så åbn dette link:<br>
    <a href="{{ url }}" style="color:{{ brand.theme_color }};word-break:break-all;">{{ url }}</a></p>
{% endmacro %}
