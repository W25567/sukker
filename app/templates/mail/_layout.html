{# Fælles layout til HTML-mails. Mailprogrammer understøtter kun simpel HTML med inline styles, så layoutet er
   en enkel tabel. Tekstudgaven (.txt) sendes altid med som alternativ. #}
<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sukker.nu{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#faf7f5;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#faf7f5;">
    <tr><td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background:#ffffff;border:1px solid #e6dfe3;border-radius:14px;">
        <tr><td style="padding:24px 28px 8px;font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:bold;color:#2b2230;">
          Sukker<span style="color:#a8325a;">.nu</span>
        </td></tr>
        <tr><td style="padding:8px 28px 24px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5;color:#2b2230;">
          {% block content %}{% endblock %}
          <p style="margin:24px 0 0;">Venlig hilsen<br>Sukker.nu</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
